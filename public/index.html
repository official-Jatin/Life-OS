<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIFE OS 2.0 — Your life, organized.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="bg-layers" aria-hidden="true">
    <div class="bg-spotlight" id="bg-spotlight"></div>
    <div class="bg-wave-layer" data-depth="14">
      <svg viewBox="0 0 1440 900" preserveAspectRatio="none">
        <defs>
          <linearGradient id="bgWave1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#222834" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#11141B" stop-opacity="0.9" />
          </linearGradient>
        </defs>
        <path d="M-80,580 C180,450 420,690 740,560 C1060,430 1260,600 1520,490 L1520,980 L-80,980 Z" fill="url(#bgWave1)" />
      </svg>
    </div>
    <div class="bg-wave-layer" data-depth="28">
      <svg viewBox="0 0 1440 900" preserveAspectRatio="none">
        <defs>
          <linearGradient id="bgWave2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#333C4D" stop-opacity="0.48" />
            <stop offset="100%" stop-color="#171B24" stop-opacity="0.75" />
          </linearGradient>
        </defs>
        <path d="M-80,700 C260,590 520,790 860,655 C1140,540 1320,700 1520,610 L1520,980 L-80,980 Z" fill="url(#bgWave2)" />
      </svg>
    </div>
    <div class="bg-wave-layer" data-depth="42">
      <svg viewBox="0 0 1440 900" preserveAspectRatio="none">
        <defs>
          <linearGradient id="bgWave3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#475569" stop-opacity="0.32" />
            <stop offset="100%" stop-color="#1B202B" stop-opacity="0.6" />
          </linearGradient>
        </defs>
        <path d="M-80,805 C320,715 620,865 960,745 C1220,655 1380,775 1520,715 L1520,980 L-80,980 Z" fill="url(#bgWave3)" />
      </svg>
    </div>
  </div>

  <div class="app-shell">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-icon"><i data-lucide="layers"></i></div>
        <div class="brand-text">
          <h1>LIFE OS 2.0</h1>
          <span>Your life, organized.</span>
        </div>
      </div>

      <nav class="nav-list" aria-label="Primary Navigation">
        <button class="nav-item active" data-view="dashboard"><i data-lucide="layout-dashboard"></i> Dashboard</button>
        <button class="nav-item" data-view="tasks"><i data-lucide="check-square"></i> Tasks</button>
        <button class="nav-item" data-view="assignments"><i data-lucide="calendar-clock"></i> Assignments</button>
        <button class="nav-item" data-view="habits"><i data-lucide="flame"></i> Habits</button>
        <button class="nav-item" data-view="timer"><i data-lucide="timer"></i> Daily Focus</button>
        <button class="nav-item" data-view="attendance"><i data-lucide="graduation-cap"></i> QUMS Learning</button>
        <button class="nav-item" data-view="analytics"><i data-lucide="bar-chart-2"></i> Analytics</button>
        <button class="nav-item" data-view="settings"><i data-lucide="settings"></i> Settings</button>
      </nav>

      <div style="padding:12px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;">
        <button id="coffee-btn" class="btn btn-secondary btn-sm" style="width:100%;justify-content:flex-start;gap:8px;"><i data-lucide="coffee" style="width:15px;height:15px;"></i> Buy me a coffee</button>
        <button id="theme-toggle-btn" class="btn btn-secondary btn-sm" style="width:100%;justify-content:space-between;">
          <span style="display:flex;align-items:center;gap:8px;"><i data-lucide="sun-moon" style="width:15px;height:15px;"></i> <span id="theme-toggle-label">B&amp;W Light Mode</span></span>
        </button>
        <div class="sidebar-footer" style="padding-top:4px;border-top:none;">
          <span id="erp-status-dot" class="status-dot"></span>
          <span id="erp-status-text">QUMS ERP: Pending</span>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="mobile-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="brand-icon" style="width:30px;height:30px;"><i data-lucide="layers" style="width:16px;height:16px;"></i></div>
          <strong style="font-size:15px;letter-spacing:0.04em;">LIFE OS 2.0</strong>
        </div>
        <div style="display:flex;align-items:center;gap:6px;"><button id="mobile-theme-btn" class="btn-icon" aria-label="Toggle theme"><i data-lucide="sun-moon"></i></button><button id="mobile-menu-btn" class="btn-icon" aria-label="Open menu">
          <i data-lucide="menu"></i>
        </button></div>
      </header>

      <main class="main-content" id="view-container"></main>
    </div>
  </div>

  <div id="confirm-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3 id="confirm-title" style="font-size:16px;font-weight:600;margin-bottom:8px;">Confirm Action</h3>
      <p id="confirm-message" style="color:var(--text-muted);font-size:13px;margin-bottom:18px;"></p>
      <div style="display:flex;justify-content:flex-end;gap:10px;">
        <button id="confirm-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button id="confirm-ok-btn" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>

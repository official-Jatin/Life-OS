<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS — Personal Productivity &amp; QUMS Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-icon"><i data-lucide="sparkles"></i></div>
        <div class="brand-text">
          <h1>LifeOS</h1>
          <span>Personal Command</span>
        </div>
      </div>

      <nav class="nav-list" aria-label="Primary Navigation">
        <button class="nav-item active" data-view="dashboard"><i data-lucide="layout-dashboard"></i> Dashboard</button>
        <button class="nav-item" data-view="tasks"><i data-lucide="check-square"></i> Tasks</button>
        <button class="nav-item" data-view="habits"><i data-lucide="flame"></i> Habits</button>
        <button class="nav-item" data-view="timer"><i data-lucide="timer"></i> Focus Timer</button>
        <button class="nav-item" data-view="attendance"><i data-lucide="graduation-cap"></i> QUMS Attendance</button>
        <button class="nav-item" data-view="analytics"><i data-lucide="bar-chart-2"></i> Analytics</button>
        <button class="nav-item" data-view="settings"><i data-lucide="settings"></i> Settings</button>
      </nav>

      <div class="sidebar-footer">
        <span id="erp-status-dot" class="status-dot"></span>
        <span id="erp-status-text">QUMS ERP: Pending</span>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="mobile-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="brand-icon" style="width:30px;height:30px;"><i data-lucide="sparkles" style="width:16px;height:16px;"></i></div>
          <strong style="font-size:16px;">LifeOS</strong>
        </div>
        <button id="mobile-menu-btn" class="btn-icon" aria-label="Open menu">
          <i data-lucide="menu"></i>
        </button>
      </header>

      <main class="main-content" id="view-container"></main>
    </div>
  </div>

  <div id="confirm-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3 id="confirm-title" style="font-size:16px;font-weight:600;margin-bottom:8px;">Confirm Action</h3>
      <p id="confirm-message" style="color:var(--text-muted);font-size:13px;margin-bottom:18px;"></p>
      <div style="display:flex;justify-content:flex-end;gap:10px;">
        <button id="confirm-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button id="confirm-ok-btn" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
